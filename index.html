<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Bank Business Finance Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 300;
        }
        
        .dashboard-container {
            width: 100%;
            height: calc(100vh - 80px);
            background: white;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 20px;
            }
            .header p {
                font-size: 12px;
            }
            .header {
                padding: 15px 20px;
            }
            .dashboard-container {
                height: calc(100vh - 70px);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>Multi-Bank Business Finance Dashboard</h1>
        <p>Real-time financial insights | Slovenia & Bosnia | Jan-Feb 2026</p>
    </div>
    
    <!-- Dashboard Container -->
    <div class="dashboard-container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading dashboard...</p>
        </div>
        <iframe 
            id="dashboard-frame"
            src="https://dbc-a4812397-4cc2.cloud.databricks.com/dashboardsv3/01f1504c62541c0196de32da7e92a8ad/published?o=7474659678273176"
            onload="document.getElementById('loading').style.display='none';"
            allow="fullscreen">
        </iframe>
    </div>

    <script>
        // Hide loading spinner after 5 seconds as fallback
        setTimeout(function() {
            document.getElementById('loading').style.display = 'none';
        }, 5000);
    </script>
</body>
</html>
